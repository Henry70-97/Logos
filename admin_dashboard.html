<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumMinds Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDm-PeCeRdlx6TKPEvKNdT93lMqb5D5O20",
            authDomain: "urbanpay-c5aee.firebaseapp.com",
            projectId: "urbanpay-c5aee",
            storageBucket: "urbanpay-c5aee.firebasestorage.app",
            messagingSenderId: "648155825006",
            appId: "1:648155825006:web:16d6ea4dfab808920b777f",
            measurementId: "G-CTKZN6VHPS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDocs(query(collection(db, 'users'), where('uid', '==', user.uid)));
                if (userDoc.empty || userDoc.docs[0].data().role !== 'admin') {
                    alert('Access denied. Admins only.');
                    window.location.href = 'index.html';
                    return;
                }
                currentUser = user;
                loadAllData();
            } else {
                window.location.href = 'index.html';
            }
        });

        async function loadAllData() {
            await loadUsers();
            await loadJobs();
            await loadTools();
        }

        // Users management
        async function loadUsers() {
            const usersSnap = await getDocs(collection(db, 'users'));
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            usersSnap.forEach(docSnap => {
                const user = docSnap.data();
                const row = `<tr>
                    <td class="border px-4 py-2">${user.fullName || 'N/A'}</td>
                    <td class="border px-4 py-2">${user.email}</td>
                    <td class="border px-4 py-2">${user.role}</td>
                    <td class="border px-4 py-2">KSh ${user.walletBalance || 0}</td>
                    <td class="border px-4 py-2">
                        <button onclick="makeAdmin('${docSnap.id}')" class="bg-green-500 text-white px-2 py-1 rounded text-sm">Make Admin</button>
                        <button onclick="deleteUser('${docSnap.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-sm ml-1">Delete</button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        window.makeAdmin = async (userId) => {
            await updateDoc(doc(db, 'users', userId), { role: 'admin' });
            loadUsers();
        };
        window.deleteUser = async (userId) => {
            if (confirm('Delete user?')) {
                await deleteDoc(doc(db, 'users', userId));
                loadUsers();
            }
        };

        // Jobs management
        async function loadJobs() {
            const jobsSnap = await getDocs(collection(db, 'jobs'));
            const tbody = document.getElementById('jobsTableBody');
            tbody.innerHTML = '';
            jobsSnap.forEach(docSnap => {
                const job = docSnap.data();
                const row = `<tr>
                    <td class="border px-4 py-2">${job.title}</td>
                    <td class="border px-4 py-2">KSh ${job.budget}</td>
                    <td class="border px-4 py-2">${job.status}</td>
                    <td class="border px-4 py-2">
                        <button onclick="deleteJob('${docSnap.id}')" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        window.deleteJob = async (jobId) => {
            if (confirm('Delete job?')) {
                await deleteDoc(doc(db, 'jobs', jobId));
                loadJobs();
            }
        };

        // Tools management
        async function loadTools() {
            const toolsSnap = await getDocs(collection(db, 'tools'));
            const tbody = document.getElementById('toolsTableBody');
            tbody.innerHTML = '';
            toolsSnap.forEach(docSnap => {
                const tool = docSnap.data();
                const row = `<tr>
                    <td class="border px-4 py-2">${tool.name}</td>
                    <td class="border px-4 py-2">KSh ${tool.price}</td>
                    <td class="border px-4 py-2">${tool.category}</td>
                    <td class="border px-4 py-2">
                        <button onclick="deleteTool('${docSnap.id}')" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        window.deleteTool = async (toolId) => {
            if (confirm('Delete tool?')) {
                await deleteDoc(doc(db, 'tools', toolId));
                loadTools();
            }
        };

        // Add new tool
        window.openAddToolModal = () => {
            document.getElementById('addToolModal').classList.remove('hidden');
        };
        window.closeAddToolModal = () => {
            document.getElementById('addToolModal').classList.add('hidden');
        };
        window.addTool = async () => {
            const name = document.getElementById('toolName').value;
            const description = document.getElementById('toolDesc').value;
            const price = parseFloat(document.getElementById('toolPrice').value);
            const category = document.getElementById('toolCategory').value;
            if (!name || !price) {
                alert('Name and price required');
                return;
            }
            await addDoc(collection(db, 'tools'), {
                name, description, price, category,
                createdAt: new Date().toISOString()
            });
            closeAddToolModal();
            loadTools();
        };

        window.logout = () => signOut(auth);
    </script>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">QuantumMinds Admin</h1>
        <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
    </header>

    <div class="container mx-auto px-4 py-6">
        <!-- Users -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-bold mb-4">Users</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full border">
                    <thead>
                        <tr><th class="border px-4 py-2">Name</th><th class="border px-4 py-2">Email</th><th class="border px-4 py-2">Role</th><th class="border px-4 py-2">Wallet</th><th class="border px-4 py-2">Actions</th></tr>
                    </thead>
                    <tbody id="usersTableBody">Loading...</tbody>
                </table>
            </div>
        </div>

        <!-- Jobs -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-bold mb-4">Jobs</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full border">
                    <thead>
                        <tr><th class="border px-4 py-2">Title</th><th class="border px-4 py-2">Budget</th><th class="border px-4 py-2">Status</th><th class="border px-4 py-2">Actions</th></tr>
                    </thead>
                    <tbody id="jobsTableBody">Loading...</tbody>
                </table>
            </div>
        </div>

        <!-- Tools -->
        <div class="bg-white p-4 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Tools</h2>
                <button onclick="openAddToolModal()" class="bg-blue-600 text-white px-3 py-1 rounded">Add Tool</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full border">
                    <thead>
                        <tr><th class="border px-4 py-2">Name</th><th class="border px-4 py-2">Price</th><th class="border px-4 py-2">Category</th><th class="border px-4 py-2">Actions</th></tr>
                    </thead>
                    <tbody id="toolsTableBody">Loading...</tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Tool Modal -->
    <div id="addToolModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-30">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Add New Tool</h3>
            <input type="text" id="toolName" placeholder="Tool Name" class="w-full border rounded-md px-3 py-2 mb-3">
            <textarea id="toolDesc" rows="3" placeholder="Description" class="w-full border rounded-md px-3 py-2 mb-3"></textarea>
            <input type="number" id="toolPrice" placeholder="Price (KSh)" class="w-full border rounded-md px-3 py-2 mb-3">
            <select id="toolCategory" class="w-full border rounded-md px-3 py-2 mb-4">
                <option value="writing">Writing</option>
                <option value="content_creation">Content Creation</option>
                <option value="business">Business</option>
            </select>
            <div class="flex justify-end gap-2">
                <button onclick="closeAddToolModal()" class="px-4 py-2 border rounded-md">Cancel</button>
                <button onclick="addTool()" class="px-4 py-2 bg-blue-600 text-white rounded-md">Add</button>
            </div>
        </div>
    </div>
</body>
</html>
